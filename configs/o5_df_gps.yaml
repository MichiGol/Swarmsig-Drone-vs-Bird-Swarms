# O5, Variante Standard-GPS: eigener GPS-Fehler im Regler wie P3_pos_gps_own (einzeln gesteuerte Wegpunktdrohnen).
base: o5_df_base.yaml

experiment:
  id: O5_df_gps

realism:
  sigma_g_m: {dist: uniform, low: 1.0, high: 3.0}        # L (wie P3_pos_gps_own)
  sigma_gv_mps: {dist: uniform, low: 0.05, high: 0.10}   # L/A
  tau_g_s: {dist: uniform, low: 10, high: 60}            # A
  gps_shared_frac: {dist: uniform, low: 0.5, high: 0.9}  # A
  own_state_noise: true
