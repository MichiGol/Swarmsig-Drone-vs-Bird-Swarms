# O5, Variante RTK: eigener GPS-Fehler im Regler wie P3_pos_rtk_own (Lichtshow-Drohnen fliegen typischerweise mit RTK).
base: o5_df_base.yaml

experiment:
  id: O5_df_rtk

realism:
  sigma_g_m: {dist: uniform, low: 0.02, high: 0.06}      # L (wie P3_pos_rtk_own)
  sigma_gv_mps: {dist: uniform, low: 0.02, high: 0.06}   # L/A
  tau_g_s: {dist: uniform, low: 1, high: 10}             # A
  gps_shared_frac: {dist: uniform, low: 0.0, high: 0.5}  # A
  own_state_noise: true
